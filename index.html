<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="https://augustineiacopelli.github.io/appaday/icons/082.png">
<meta name="apple-mobile-web-app-title" content="Memory">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Memory Grid &middot; AppADay 082</title>
<meta name="description" content="A tap-to-flip matching game with a configurable grid, move counter, and timer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f5f3ff;
    --muted:#c4b5fd;
    --panel:rgba(255,255,255,0.08);
    --panel-brd:rgba(255,255,255,0.16);
    --accent:#22d3ee;
    --accent-2:#0ea5e9;
    --good:#34d399;
    --gold:#fbbf24;
    --shadow:0 10px 30px rgba(12,8,40,0.45);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Fredoka",system-ui,sans-serif;
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(56,189,248,0.28), transparent 60%),
      linear-gradient(160deg,#312e81 0%,#5b21b6 52%,#7c3aed 100%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px clamp(14px,4vw,26px);
    font-size:14px;
  }
  .brandtag{font-weight:600;letter-spacing:.3px;color:var(--ink)}
  .brandtag .num{color:var(--accent);font-weight:700}
  .home{
    color:var(--muted);text-decoration:none;font-weight:500;
    padding:6px 12px;border:1px solid var(--panel-brd);border-radius:999px;
    background:var(--panel);transition:color .2s,border-color .2s;
    white-space:nowrap;
  }
  .home:hover,.home:focus-visible{color:var(--ink);border-color:var(--accent)}

  main{
    flex:1;
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:6px clamp(14px,4vw,26px) 28px;
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
  }

  header.hero{text-align:center;margin-top:4px}
  header.hero h1{
    font-size:clamp(30px,8vw,44px);
    font-weight:700;line-height:1.05;letter-spacing:.5px;
  }
  header.hero p{color:var(--muted);font-size:14px;margin-top:6px}

  .controls{
    width:100%;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
  }
  .seg{
    display:inline-flex;background:var(--panel);border:1px solid var(--panel-brd);
    border-radius:999px;padding:4px;gap:2px;
  }
  .seg button{
    font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
    background:transparent;border:0;cursor:pointer;
    padding:8px 16px;border-radius:999px;transition:background .2s,color .2s;
    min-height:38px;
  }
  .seg button[aria-pressed="true"]{
    color:#0b1020;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    box-shadow:0 4px 12px rgba(14,165,233,0.35);
  }
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
    background:var(--panel);border:1px solid var(--panel-brd);
    padding:9px 18px;border-radius:999px;min-height:40px;
    transition:background .2s,border-color .2s,transform .06s;
  }
  .btn:hover,.btn:focus-visible{border-color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn.iconbtn{padding:9px 12px;line-height:1}

  .stats{
    width:100%;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  }
  .stat{
    flex:1 1 96px;max-width:150px;text-align:center;
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:14px;
    padding:10px 8px;
  }
  .stat .label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .stat .value{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .value.best{font-size:15px;color:var(--gold);font-weight:600}

  .board{
    width:min(92vw,33rem);
    display:grid;
    grid-template-columns:repeat(var(--cols,4),1fr);
    gap:clamp(6px,1.6vw,12px);
    margin:2px auto 0;
  }
  .card{
    position:relative;
    aspect-ratio:1/1;
    border:0;padding:0;margin:0;background:transparent;cursor:pointer;
    perspective:700px;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .card:disabled{cursor:default}
  .card-inner{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition:transform .42s cubic-bezier(.2,.7,.3,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius);
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    box-shadow:var(--shadow);
  }
  .face.back{
    background:linear-gradient(150deg,#22d3ee 0%,#3b82f6 100%);
  }
  .face.back .emblem{
    width:34%;aspect-ratio:1/1;border-radius:8px;
    background:rgba(255,255,255,0.85);
    transform:rotate(45deg);
    box-shadow:inset 0 0 0 3px rgba(59,130,246,0.4);
  }
  .face.front{
    background:#ffffff;color:#111;
    transform:rotateY(180deg);
    font-size:clamp(1.5rem,calc(48vmin / var(--cols,4)),3.4rem);
    line-height:1;
    user-select:none;
  }
  .card.matched .card-inner{transform:rotateY(180deg)}
  .card.matched .face.front{
    background:linear-gradient(160deg,#ecfdf5,#d1fae5);
    box-shadow:0 0 0 3px var(--good), var(--shadow);
    animation:pop .34s ease;
  }
  @keyframes pop{
    0%{transform:scale(1)}
    45%{transform:scale(1.08)}
    100%{transform:scale(1)}
  }
  @media (prefers-reduced-motion:reduce){
    .card-inner{transition:none}
    .card.matched .face.front{animation:none}
  }

  /* win modal */
  .overlay{
    position:fixed;inset:0;z-index:20;
    display:none;align-items:center;justify-content:center;
    padding:22px;
    background:rgba(15,10,40,0.62);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .overlay.show{display:flex}
  .modal{
    width:100%;max-width:340px;text-align:center;
    background:linear-gradient(165deg,#4c1d95,#6d28d9);
    border:1px solid var(--panel-brd);border-radius:22px;
    padding:26px 22px;box-shadow:var(--shadow);
  }
  .modal .crown{font-size:40px;line-height:1}
  .modal h2{font-size:26px;font-weight:700;margin:8px 0 4px}
  .modal .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .modal .result{
    display:flex;justify-content:center;gap:22px;margin-bottom:6px;
  }
  .modal .result .r .rv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .modal .result .r .rl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .modal .newbest{
    color:var(--gold);font-weight:600;font-size:14px;min-height:20px;margin:8px 0 16px;
  }
  .modal .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .modal .actions .btn.primary{
    color:#0b1020;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;
  }

  footer{
    text-align:center;color:var(--muted);font-size:12px;
    padding:6px 16px 16px;
  }
  footer a{color:var(--muted)}
</style>
</head>
<body>
  <div class="topbar">
    <span class="brandtag"><span class="num">082</span> &middot; Memory Grid</span>
    <a class="home" href="https://augustineiacopelli.github.io/appaday/">AppADay</a>
  </div>

  <main>
    <header class="hero">
      <h1>Memory Grid</h1>
      <p>Flip two cards. Find every pair.</p>
    </header>

    <div class="controls">
      <div class="seg" role="group" aria-label="Difficulty">
        <button type="button" data-level="easy" aria-pressed="true">Easy</button>
        <button type="button" data-level="medium" aria-pressed="false">Medium</button>
        <button type="button" data-level="hard" aria-pressed="false">Hard</button>
      </div>
      <button type="button" class="btn" id="newGame">New Game</button>
      <button type="button" class="btn iconbtn" id="soundToggle" aria-label="Toggle sound">Sound: On</button>
    </div>

    <div class="stats" aria-live="polite">
      <div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="time">0:00</div></div>
      <div class="stat"><div class="label">Pairs</div><div class="value" id="pairs">0/8</div></div>
      <div class="stat"><div class="label">Best</div><div class="value best" id="best">--</div></div>
    </div>

    <div class="board" id="board" aria-label="Memory board"></div>
  </main>

  <footer>
    One app a day. <a href="https://augustineiacopelli.github.io/appaday/">See the whole archive</a>.
  </footer>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal">
      <div class="crown">&#127942;</div>
      <h2 id="winTitle">You cleared the board!</h2>
      <div class="sub" id="winLevel">Easy grid</div>
      <div class="result">
        <div class="r"><div class="rv" id="winTime">0:00</div><div class="rl">Time</div></div>
        <div class="r"><div class="rv" id="winMoves">0</div><div class="rl">Moves</div></div>
      </div>
      <div class="newbest" id="newBest">&nbsp;</div>
      <div class="actions">
        <button type="button" class="btn primary" id="playAgain">Play Again</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "appaday082-best";

  // Card faces as escaped code points to keep the source ASCII-clean.
  var SYMBOLS = [
    "\u{1F34E}", "\u{1F34C}", "\u{1F347}", "\u{1F352}", "\u{1F353}", "\u{1F349}",
    "\u{1F34B}", "\u{1F351}", "\u{1F436}", "\u{1F431}", "\u{1F438}", "\u{1F437}",
    "\u{1F435}", "\u{1F43C}", "\u2B50", "\u2728", "\u{1F680}", "\u{1F308}"
  ];

  var LEVELS = {
    easy:   { pairs: 8,  cols: 4, label: "Easy grid" },
    medium: { pairs: 12, cols: 4, label: "Medium grid" },
    hard:   { pairs: 18, cols: 6, label: "Hard grid" }
  };

  var els = {};
  var level = "easy";
  var deck = [];
  var first = null;
  var lock = false;
  var moves = 0;
  var matched = 0;
  var totalPairs = 8;
  var startTs = 0;
  var timerId = 0;
  var running = false;
  var soundOn = true;
  var audioCtx = null;

  function readBest(){
    try{
      var raw = window.localStorage.getItem(STORE_KEY);
      if(raw){ return JSON.parse(raw) || {}; }
    }catch(e){}
    return {};
  }
  function writeBest(obj){
    try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }catch(e){}
  }
  function readSound(){
    try{
      var v = window.localStorage.getItem(STORE_KEY + "-sound");
      if(v === "off"){ return false; }
    }catch(e){}
    return true;
  }
  function writeSound(on){
    try{ window.localStorage.setItem(STORE_KEY + "-sound", on ? "on" : "off"); }catch(e){}
  }

  function fmtTime(sec){
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ---- sound (generated, no external files) ----
  function ensureAudio(){
    if(audioCtx){ return audioCtx; }
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ audioCtx = new AC(); }
    }catch(e){ audioCtx = null; }
    return audioCtx;
  }
  function tone(freq, dur, type, vol){
    if(!soundOn){ return; }
    var ctx = ensureAudio();
    if(!ctx){ return; }
    try{
      if(ctx.state === "suspended"){ ctx.resume(); }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      var now = ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol || 0.08, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    }catch(e){}
  }
  function sFlip(){ tone(520, 0.09, "triangle", 0.05); }
  function sMatch(){ tone(660, 0.12, "sine", 0.08); setTimeout(function(){ tone(880, 0.16, "sine", 0.08); }, 90); }
  function sMiss(){ tone(220, 0.16, "sine", 0.05); }
  function sWin(){
    var notes = [523, 659, 784, 1047];
    notes.forEach(function(f, i){ setTimeout(function(){ tone(f, 0.22, "triangle", 0.09); }, i * 130); });
  }

  // ---- timer ----
  function startTimer(){
    if(running){ return; }
    running = true;
    startTs = Date.now();
    timerId = window.setInterval(tickTimer, 250);
  }
  function tickTimer(){
    var sec = Math.floor((Date.now() - startTs) / 1000);
    els.time.textContent = fmtTime(sec);
  }
  function stopTimer(){
    running = false;
    if(timerId){ window.clearInterval(timerId); timerId = 0; }
  }
  function elapsedSec(){
    return startTs ? Math.floor((Date.now() - startTs) / 1000) : 0;
  }

  // ---- render ----
  function updateStats(){
    els.moves.textContent = String(moves);
    els.pairs.textContent = matched + "/" + totalPairs;
    var best = readBest()[level];
    els.best.textContent = (typeof best === "number") ? fmtTime(best) : "--";
  }

  function buildDeck(){
    var cfg = LEVELS[level];
    totalPairs = cfg.pairs;
    var faces = shuffle(SYMBOLS.slice()).slice(0, cfg.pairs);
    var pool = [];
    faces.forEach(function(sym){ pool.push(sym); pool.push(sym); });
    shuffle(pool);
    deck = pool.map(function(sym, i){ return { id: i, sym: sym, matched: false }; });
  }

  function renderBoard(){
    var cfg = LEVELS[level];
    els.board.style.setProperty("--cols", cfg.cols);
    els.board.innerHTML = "";
    deck.forEach(function(card){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card";
      btn.setAttribute("data-id", String(card.id));
      btn.setAttribute("aria-label", "Hidden card");
      btn.innerHTML =
        '<span class="card-inner">' +
          '<span class="face back"><span class="emblem"></span></span>' +
          '<span class="face front">' + card.sym + "</span>" +
        "</span>";
      btn.addEventListener("click", function(){ onFlip(card.id); });
      els.board.appendChild(btn);
    });
  }

  function cardEl(id){
    return els.board.querySelector('[data-id="' + id + '"]');
  }

  function newGame(){
    stopTimer();
    first = null; lock = false; moves = 0; matched = 0; running = false; startTs = 0;
    els.time.textContent = "0:00";
    buildDeck();
    renderBoard();
    updateStats();
    hideOverlay();
  }

  function onFlip(id){
    if(lock){ return; }
    var card = deck[id];
    if(!card || card.matched){ return; }
    var el = cardEl(id);
    if(!el || el.classList.contains("flipped")){ return; }

    startTimer();
    el.classList.add("flipped");
    el.setAttribute("aria-label", "Card showing a symbol");
    sFlip();

    if(first === null){
      first = id;
      return;
    }
    if(first === id){ return; }

    moves += 1;
    updateStats();

    var a = deck[first];
    var b = deck[id];
    var firstId = first;
    first = null;

    if(a.sym === b.sym){
      a.matched = true; b.matched = true;
      matched += 1;
      var ea = cardEl(firstId);
      var eb = cardEl(id);
      lock = true;
      window.setTimeout(function(){
        if(ea){ ea.classList.add("matched"); ea.disabled = true; ea.setAttribute("aria-label", "Matched pair"); }
        if(eb){ eb.classList.add("matched"); eb.disabled = true; eb.setAttribute("aria-label", "Matched pair"); }
        sMatch();
        lock = false;
        updateStats();
        if(matched === totalPairs){ win(); }
      }, 260);
    }else{
      lock = true;
      sMiss();
      window.setTimeout(function(){
        var ea = cardEl(firstId);
        var eb = cardEl(id);
        if(ea){ ea.classList.remove("flipped"); ea.setAttribute("aria-label", "Hidden card"); }
        if(eb){ eb.classList.remove("flipped"); eb.setAttribute("aria-label", "Hidden card"); }
        lock = false;
      }, 780);
    }
  }

  function win(){
    stopTimer();
    var sec = elapsedSec();
    els.winTime.textContent = fmtTime(sec);
    els.winMoves.textContent = String(moves);
    els.winLevel.textContent = LEVELS[level].label;

    var best = readBest();
    var prev = best[level];
    if(typeof prev !== "number" || sec < prev){
      best[level] = sec;
      writeBest(best);
      els.newBest.innerHTML = "New best time!";
    }else{
      els.newBest.innerHTML = "&nbsp;";
    }
    updateStats();
    sWin();
    showOverlay();
  }

  function showOverlay(){ els.overlay.classList.add("show"); }
  function hideOverlay(){ els.overlay.classList.remove("show"); }

  function setLevel(next){
    if(!LEVELS[next]){ return; }
    level = next;
    var btns = els.board.ownerDocument.querySelectorAll(".seg button");
    for(var i = 0; i < btns.length; i++){
      var on = btns[i].getAttribute("data-level") === next;
      btns[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
    newGame();
  }

  function toggleSound(){
    soundOn = !soundOn;
    writeSound(soundOn);
    els.soundToggle.textContent = "Sound: " + (soundOn ? "On" : "Off");
    if(soundOn){ sFlip(); }
  }

  function init(){
    els.board = document.getElementById("board");
    els.moves = document.getElementById("moves");
    els.time = document.getElementById("time");
    els.pairs = document.getElementById("pairs");
    els.best = document.getElementById("best");
    els.overlay = document.getElementById("overlay");
    els.winTime = document.getElementById("winTime");
    els.winMoves = document.getElementById("winMoves");
    els.winLevel = document.getElementById("winLevel");
    els.newBest = document.getElementById("newBest");
    els.soundToggle = document.getElementById("soundToggle");

    soundOn = readSound();
    els.soundToggle.textContent = "Sound: " + (soundOn ? "On" : "Off");

    var segBtns = document.querySelectorAll(".seg button");
    for(var i = 0; i < segBtns.length; i++){
      (function(b){
        b.addEventListener("click", function(){ setLevel(b.getAttribute("data-level")); });
      })(segBtns[i]);
    }
    document.getElementById("newGame").addEventListener("click", newGame);
    document.getElementById("playAgain").addEventListener("click", newGame);
    els.soundToggle.addEventListener("click", toggleSound);
    els.overlay.addEventListener("click", function(e){
      if(e.target === els.overlay){ hideOverlay(); }
    });

    newGame();
  }

  window.addEventListener("load", init);
})();
</script>
</body>
</html>
